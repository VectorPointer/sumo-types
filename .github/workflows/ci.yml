name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Every feature combination, not a hand-kept list: with three format
      # features (plus `write`) the combinations outgrew being enumerated by
      # hand, and the ones that get forgotten are exactly where bugs hide (a
      # type name that only resolves when another feature happens to be on,
      # an intra-doc link to a gated item). `--exclude-no-default-features`
      # skips the empty set; `--at-least-one-of net,routes,additional` skips
      # every set with `write` and no format to write — both rejected on
      # purpose (`write` alone hits the same `compile_error!` as the empty
      # set, since it isn't `net`/`routes`/`additional` either), and both
      # covered by the diagnostic check below instead of being compiled here.
      - uses: taiki-e/install-action@cargo-hack

      # `-D warnings` goes after `--`, not in RUSTFLAGS: RUSTFLAGS applies to
      # dependencies too, and this crate's warning policy is not theirs.
      - name: Clippy
        run: >
          cargo hack --feature-powerset --exclude-no-default-features
          --at-least-one-of net,routes,additional
          clippy --all-targets -- -D warnings

      - name: Test
        run: >
          cargo hack --feature-powerset --exclude-no-default-features
          --at-least-one-of net,routes,additional test

      # The empty feature set, and `write` on its own, must both fail, and
      # both as an ordinary rustc error naming the missing feature — not as
      # an opaque build-script failure or a confusing "function is never
      # used" from `write_document` having no format to serve. Regressing
      # either is easy and silent.
      - name: Reject feature sets with no format feature, with a real diagnostic
        run: |
          for features in "" "write"; do
            if cargo check --no-default-features --features "$features" 2>cargo-err.txt; then
              echo "expected --features \"$features\" to fail, but it succeeded"
              exit 1
            fi
            cat cargo-err.txt
            grep -q "at least one format feature" cargo-err.txt
          done

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Intra-doc links to feature-gated items break under any feature set
      # that doesn't enable them, and the crate-level `//!` docs can't be
      # `#[cfg]`-gated — so every combination has to be clean, not just the
      # `--all-features` one docs.rs builds.
      - name: Build docs under every feature combination
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo hack --feature-powerset --exclude-no-default-features \
            --at-least-one-of net,routes,additional doc --no-deps

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` only verifies the default feature set, but `include`
      # ships the schemas the non-default features need too — so build the
      # packaged tarball with every feature on, which is what a consumer
      # enabling `routes` or `additional` from crates.io actually does.
      #
      # The `rm -rf` is load-bearing: `rust-cache` restores `target/`, so a
      # previous run's `target/package/sumo-types-<old version>/` survives
      # into this one and the glob below then matches two directories. That
      # is what broke the first build after the version bump, and it only
      # reproduces on a runner with a warm cache.
      - name: Package and build the tarball with all features
        run: |
          rm -rf target/package
          cargo package
          cd target/package/sumo-types-*/
          cargo build --all-features
