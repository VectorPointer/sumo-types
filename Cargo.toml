[package]
name = "sumo-types"
version = "0.2.1"
edition = "2024"
# 1.86, not 1.85 (what edition 2024 alone needs): `xsd-parser` pulls in the
# `icu_*` crates as a build-dependency, and those require 1.86. A build
# dependency still has to compile on the consumer's toolchain, so it sets
# the floor just as a regular one would. Verified in CI.
rust-version = "1.86"
authors = ["Víctor Ariño Pellejero"]
description = "Reads and writes SUMO (Eclipse SUMO) .net.xml, .rou.xml and .add.xml files as well-typed Rust structs"
keywords = ["sumo", "traffic", "simulation", "netconvert", "xml"]
categories = ["parser-implementations", "science"]
# `MIT OR Apache-2.0` covers this crate's own code; the `AND EPL-2.0` covers
# the Eclipse SUMO schemas under `xsd/` that the package redistributes
# verbatim (see NOTICE and LICENSE-EPL). The whole expression is what license
# scanners read, so it has to describe the *tarball*, not just `src/`.
license = "(MIT OR Apache-2.0) AND EPL-2.0"
readme = "README.md"
repository = "https://github.com/VectorPointer/sumo-types"
documentation = "https://docs.rs/sumo-types"
# Only the schemas the implemented features need are published. The other
# 69 under `xsd/` describe unrelated SUMO file formats (detectors, tool
# configurations, ...) that nothing here reads, and publishing them would
# mean redistributing hundreds of KB of Eclipse SUMO's EPL-2.0 files for
# nothing. They stay in the repository so adding a reader for another
# format later doesn't mean re-vendoring them.
include = [
    "src/**/*.rs",
    "build.rs",
    "xsd/net_file.xsd",        # net
    "xsd/types/taz.xsd",       # net + additional
    "xsd/routes_file.xsd",     # routes
    "xsd/types/route.xsd",     # routes + additional
    "xsd/additional_file.xsd", # additional
    "xsd/types/base.xsd",      # all three
    "README.md",
    "NOTICE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-EPL",             # covers the `xsd/` files above
]

# docs.rs builds with default features unless told otherwise, which would
# document `net` alone and silently omit `routes`, `additional` and every
# `write_*` function — most of the public API.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Mirrors what CI enforces (`-D warnings` on both `cargo clippy` and, via
# `RUSTDOCFLAGS`, `cargo doc`) as the *default* lint level, so a plain
# `cargo clippy` / `cargo doc` fails locally exactly like CI does, instead of
# only warning and leaving the failure to be discovered at CI time. `deny`,
# not `forbid`: item-level `#[allow(...)]` (e.g. `clippy::all` and friends on
# the generated `schema` module in `lib.rs`) must still be able to override
# this default — `forbid` would block that.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[features]
default = ["net"]
# Reads `.net.xml` (`netconvert` output) into `Network`/`Edge`/`Lane`/...
net = []
# Reads `.rou.xml` (traffic demand: routes, vehicle types, vehicles) into
# `routes::Routes`. Independent of `net` — it does not require it enabled.
routes = []
# Reads `.add.xml` (SUMO "additional" files) into `additional::Additional`,
# modelling the E1/E2/E3 detector definitions. Independent of the other two.
additional = []
# Not a format of its own: adds a `write_*` counterpart to every enabled
# format's `read_*` (`write_network`, `routes::write_routes`,
# `additional::write_additional`), running the same domain <-> schema
# pipeline backwards. Separate from `net`/`routes`/`additional` because it
# roughly doubles `build.rs`'s generated code (serializers alongside the
# deserializers — see `build.rs`), a compile-time cost a read-only consumer
# shouldn't have to pay.
write = []

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "from", "as_ref"] }
# `thiserror`, not `anyhow`: this crate's `Error` is a typed enum consumers
# can match on, and `thiserror` is a `derive`-only dependency that appears in
# no signature — so, unlike an erased `anyhow::Error` return type, bumping it
# is not a breaking change here. Same reasoning that keeps
# `xsd-parser-types` out of the public API; see `src/error.rs`.
thiserror = "2.0.20"
uom = "0.38.0"
xsd-parser-types = { version = "0.2.1", features = ["quick-xml"] }

[build-dependencies]
xsd-parser = "1.5.2"
# Already a transitive dependency of `xsd-parser`, declared directly because
# `SumoNaming` reimplements part of its default naming strategy (see build.rs).
Inflector = "0.11.4"
# xsd-parser emits the whole schema as one `TokenStream`; without these, it
# lands in OUT_DIR as a single multi-megabyte line and every rustc diagnostic
# pointing into `schema` is unreadable.
prettyplease = "0.2"
syn = { version = "2", features = ["full", "parsing"] }
