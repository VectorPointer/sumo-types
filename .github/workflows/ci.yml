name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Every feature combination, not a hand-kept list: with three format
      # features the combinations outgrew being enumerated by hand, and the
      # ones that get forgotten are exactly where bugs hide (a type name that
      # only resolves when another feature happens to be on, an intra-doc link
      # to a gated item). `--exclude-no-default-features` skips the empty set,
      # which is rejected on purpose — the step below covers that case.
      - uses: taiki-e/install-action@cargo-hack

      # `-D warnings` goes after `--`, not in RUSTFLAGS: RUSTFLAGS applies to
      # dependencies too, and this crate's warning policy is not theirs.
      - name: Clippy
        run: >
          cargo hack --feature-powerset --exclude-no-default-features
          clippy --all-targets -- -D warnings

      - name: Test
        run: cargo hack --feature-powerset --exclude-no-default-features test

      # The empty feature set must fail, and must fail as an ordinary rustc
      # error naming the missing feature — not as an opaque build-script
      # failure. Regressing that is easy and silent.
      - name: Reject the empty feature set with a real diagnostic
        run: |
          if cargo check --no-default-features 2>cargo-err.txt; then
            echo "expected --no-default-features to fail, but it succeeded"
            exit 1
          fi
          cat cargo-err.txt
          grep -q "at least one format feature" cargo-err.txt

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Intra-doc links to feature-gated items break under any feature set
      # that doesn't enable them, and the crate-level `//!` docs can't be
      # `#[cfg]`-gated — so every combination has to be clean, not just the
      # `--all-features` one docs.rs builds.
      - name: Build docs under every feature combination
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo hack --feature-powerset --exclude-no-default-features \
            doc --no-deps

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` only verifies the default feature set, but `include`
      # ships the schemas `routes` needs too — so build the packaged tarball
      # with every feature on, which is what a consumer enabling `routes`
      # from crates.io actually does.
      - name: Package and build the tarball with all features
        run: |
          cargo package
          cd target/package/sumo-types-*/
          cargo build --all-features
